<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NamY English - Đăng Nhập</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>🎓 NamY English</h2>
            <p>Học Tiếng Anh Chủ Động & Hiệu Quả</p>
        </div>
        
        <div class="login-form">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tài khoản học sinh hoặc admin...">
            </div>
            
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu...">
            </div>
            
            <div id="login-error" class="error-message" style="display: none;"></div>
            
            <button id="login-btn" class="btn btn-primary btn-block">Vào Học</button>
        </div>
        
        <div class="login-footer">
            <p>Made with ❤️ by NamY</p>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
